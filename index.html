<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Курсы</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold text-gray-800">📚 Мои курсы</h1>
      <div class="flex items-center gap-4 text-sm">
        <span class="text-yellow-500 font-bold">⭐ <span id="xp">0</span> XP</span>
        <span class="text-gray-600">🏆 <span id="ach-count">0</span></span>
      </div>
    </div>
    <div class="max-w-3xl mx-auto px-4 pb-3">
      <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-indigo-500 transition-all" style="width:0%"></div>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 space-y-4">
    <div id="courses-list" class="space-y-4"></div>
    <button onclick="resetProgress()" class="text-sm text-red-500 hover:underline mt-6">
      Сбросить прогресс
    </button>
  </main>
  
<script src="scripts/data.js"></script>
<script src="scripts/progress.js"></script>
<script src="scripts/site.js"></script>
</body>
</html>
